version: 1
backend:
  phases:
    build:
      commands:
        - rm -f "${NVM_DIR:-$HOME/.nvm}/default-packages"
        - nvm install 24.20.0
        - nvm use 24.20.0
        - node -v
        - npm -v
        - npm install --include=dev
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    build:
      commands:
        - nvm use 24.20.0
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
